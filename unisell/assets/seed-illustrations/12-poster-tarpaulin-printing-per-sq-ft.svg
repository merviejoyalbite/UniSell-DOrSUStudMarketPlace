      <path d="M590 330 h20 M590 360 h14 M590 390 h20 M590 420 h14 M590 450 h20" stroke="#0E6A5F" stroke-width="3"/>
      <text x="610" y="500" text-anchor="middle" font-size="12" font-weight="700" fill="#0E6A5F">SQ FT</text>
