<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>UniSell responsive lab</title>
<style>
  body { margin: 0; background: #0f172a; font: 12px/1.4 monospace; color: #e2e8f0; }
  .frame { position: relative; margin: 10px auto; border: 1px solid #334155; overflow: hidden; background: #fff; }
  .frame iframe { width: 100%; height: 100%; border: 0; display: block; }
  .label { position: absolute; top: 0; left: 0; background: #000; color: #4ade80; padding: 3px 8px; z-index: 9; font-weight: bold; }
</style>
</head>
<body>
  <div id="frames"></div>
  <script>
    var widths = [360, 640, 768, 1024, 1440];
    var host = document.getElementById('frames');
    widths.forEach(function (w) {
      var frame = document.createElement('div');
      frame.className = 'frame';
      frame.style.width = w + 'px';
      frame.style.height = '880px';
      var label = document.createElement('span');
      label.className = 'label';
      label.textContent = w + 'px';
      var iframe = document.createElement('iframe');
      iframe.src = 'http://localhost:8081/';
      frame.appendChild(label);
      frame.appendChild(iframe);
      host.appendChild(frame);
    });
  </script>
</body>
</html>
